schema: spec-driven

context: |
  Product: iOS app for UAE operator du.
  Stack: Swift, SwiftUI, Xcode.
  Artifacts: Chinese (Simplified).
  User communication: Chinese.
  Style: concise, direct, low-token.
  Reuse existing patterns first.
  Flow: explore -> propose -> specs -> design -> tasks -> plan -> implement -> verify -> review -> sync/archive.
  Skills: openspec-explore, brainstorming, writing-plans, test-driven-development, systematic-debugging, verification-before-completion, requesting-code-review or review-swarm.

rules:
  proposal:
    - Chinese (Simplified) only.
    - Max 500 Chinese characters.
    - "Sections: 问题, 目标, 范围, 非目标, 风险."

  specs:
    - Chinese (Simplified) only.
    - One capability per spec.
    - Use short MUST/SHALL-style statements in Chinese (e.g., “必须/应当”).
    - Include acceptance criteria.
    - No design or code detail.

  design:
    - Chinese (Simplified) only.
    - Max 800 Chinese characters.
    - Cover architecture, data flow, errors, tests, rollout.
    - Note localization or performance when relevant.

  tasks:
    - Chinese (Simplified) only.
    - Short checklist items.
    - One deliverable per item.
    - "Order: 测试或验证性实验, 实现, 验证, 评审, 归档."
